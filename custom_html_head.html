<script>
  // Add class to HTML element if backdrop-filter is supported
  (function() {
    const testEl = document.createElement('div');
    if (typeof testEl.style.backdropFilter !== 'undefined' || typeof testEl.style.webkitBackdropFilter !== 'undefined') {
      document.documentElement.classList.add('mdz-backdropfilter');
    }
  })();
</script>
